# A Chromebook's storage is a small, slow eMMC or SD card, where systemd's
# default cap (10% of the filesystem) lets the journal grow to gigabytes and
# compete with the desktop for the card's bandwidth. Keep it bounded.
#
# An administrator who wants more overrides this from
# /etc/systemd/journald.conf.d/, which systemd reads after vendor drop-ins.
[Journal]
SystemMaxUse=200M
SystemMaxFileSize=50M
