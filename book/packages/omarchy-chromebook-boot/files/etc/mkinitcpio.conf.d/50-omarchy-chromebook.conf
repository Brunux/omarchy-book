# omarchy-chromebook-boot: the initramfs a Chromebook's kernel partition carries.
# Sourced after Omarchy's 00-omarchy-hooks.conf, so it edits that HOOKS line.
#
# - autodetect keeps only the modules the build machine uses. An image is built
#   on another machine, and the initramfs inside a kernel partition is the only
#   one the board has, so it carries every module its hooks name.
# - btrfs-overlayfs boots Limine's read-only snapshot entries and ships with
#   limine-snapper-sync. depthcharge has no boot menu and a Chromebook installs
#   no limine-snapper-sync, so the hook would only fail the build.
#
# The board's own early modules are added by 60-omarchy-chromebook-device.conf,
# which `omarchy-chromebook-boot initramfs-config` writes from its profile.
_omarchy_chromebook_hooks=()
for _omarchy_chromebook_hook in "${HOOKS[@]}"; do
  case $_omarchy_chromebook_hook in
    autodetect | btrfs-overlayfs) ;;
    *) _omarchy_chromebook_hooks+=("$_omarchy_chromebook_hook") ;;
  esac
done
HOOKS=("${_omarchy_chromebook_hooks[@]}")
unset _omarchy_chromebook_hook _omarchy_chromebook_hooks
