# omarchy-lite: the session's environment (systemd user manager, so Hyprland,
# the Omarchy shell and every app launched from them).
#
# glibc gives each thread that contends for malloc an arena of its own, up to
# eight per core, and memory freed in one arena is not reused by another. Qt's
# QML engine, its render threads and PipeWire's are exactly that workload, and
# on a 4 GB machine the fragmentation shows up as resident memory. Two arenas
# trade a little allocation throughput for it.
MALLOC_ARENA_MAX=2
