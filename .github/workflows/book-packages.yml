# Omarchy Book: test the Chromebook port, and on request build its package
# repository and publish it as release assets (book/specs/0006).
name: Book packages

on:
  push:
    paths:
      - "book/**"
      - ".github/workflows/book-packages.yml"
  pull_request:
    paths:
      - "book/**"
  workflow_dispatch:
    inputs:
      build:
        description: "Build the packages (kernels take about an hour)"
        type: boolean
        default: true
      publish:
        description: "Publish them to the chromebook-edge-aarch64 release"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package tests
        run: |
          book/packages/omarchy-chromebook-boot/test/all
          book/packages/omarchy-chromebook/test/all
          book/packages/omarchy-lite/test/all
      - name: Board profiles and kernels
        run: book/tools/check-devices
      - name: Upstream tests the platform registration lives in
        run: |
          sudo apt-get install -y pacman-package-manager >/dev/null
          for t in hw-platform image-target-platform lifecycle-dispatch pacman-templates platform-packages platform-setup; do
            bash test/shell.d/$t-test.sh >/tmp/$t.log 2>&1 || { cat /tmp/$t.log; exit 1; }
          done

  build:
    if: github.event_name == 'workflow_dispatch' && inputs.build
    needs: test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    container:
      # The Arch Linux ARM image omacom/omarchy-iso builds in (bin/omarchy-iso-make).
      image: ghcr.io/menci/archlinuxarm@sha256:3e1074c407fc1a57c2a2117af6920c96a7cc906fa6f1f2da8a4a7fd3aa2c2f4e
    steps:
      - name: Prepare the build system
        run: |
          # Runner kernels without Landlock: pacman cannot fence its downloads there.
          sed -i "/^\[options\]/a DisableSandboxFilesystem" /etc/pacman.conf
          echo 'Server = https://arm-mirror.omarchy.org/$arch/$repo' >/etc/pacman.d/mirrorlist
          pacman-key --init && pacman-key --populate archlinuxarm
          pacman -Syu --noconfirm --needed base-devel git sudo
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >/etc/sudoers.d/builder
      - uses: actions/checkout@v4
        with:
          # The runtime's version counts the branch's commits.
          fetch-depth: 0
      - name: Import the signing key
        env:
          BOOK_SIGNING_KEY: ${{ secrets.BOOK_SIGNING_KEY }}
        run: |
          if [ -n "$BOOK_SIGNING_KEY" ]; then
            printf '%s\n' "$BOOK_SIGNING_KEY" | sudo -u builder gpg --batch --import
            sudo -u builder gpg --list-secret-keys --with-colons | awk -F: '$1 == "fpr" { print $10; exit }' >/tmp/signing-key
            # makepkg and repo-add call gpg themselves, with nobody to type a
            # passphrase, so the key must have none. Fail here, in seconds,
            # rather than after the first package builds.
            if ! echo test | sudo -u builder gpg --batch --pinentry-mode error --local-user "$(cat /tmp/signing-key)" --detach-sign -o /dev/null; then
              echo "::error::BOOK_SIGNING_KEY cannot sign unattended. Use a signing key without a passphrase (book/docs/building.md)."
              exit 1
            fi
          fi
      - name: Build
        run: |
          chown -R builder "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sign=()
          [ ! -s /tmp/signing-key ] || sign=(--sign "$(cat /tmp/signing-key)")
          sudo -u builder git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo -u builder book/tools/build-packages --out "$GITHUB_WORKSPACE/repo" "${sign[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: omarchy-chromebook-repo
          path: |
            repo/*.pkg.tar.zst
            repo/*.pkg.tar.zst.sig
            repo/omarchy-chromebook.db*
            repo/omarchy-chromebook.files*

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.build && inputs.publish && github.ref == 'refs/heads/quattro'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: omarchy-chromebook-repo
          path: repo
      - name: Publish to the chromebook-edge-aarch64 release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd repo
          # Release assets cannot be symlinks: upload the databases under the
          # names pacman asks for.
          for db in omarchy-chromebook.db omarchy-chromebook.files; do
            [ ! -L "$db" ] || cp --remove-destination "$(readlink "$db")" "$db"
            [ ! -L "$db.sig" ] || cp --remove-destination "$(readlink "$db.sig")" "$db.sig"
          done
          tag=chromebook-edge-aarch64
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --prerelease --title "Chromebook packages (edge, aarch64)" \
              --notes "The pacman repository default/pacman/aarch64-chromebook points at. See book/specs/0006."
          gh release upload "$tag" --clobber ./*.pkg.tar.zst* omarchy-chromebook.db* omarchy-chromebook.files*
          # Drop packages the new database no longer names.
          keep=$(ls)
          gh release view "$tag" --json assets --jq '.assets[].name' | while read -r asset; do
            grep -qxF "$asset" <<<"$keep" || gh release delete-asset "$tag" "$asset" --yes
          done
