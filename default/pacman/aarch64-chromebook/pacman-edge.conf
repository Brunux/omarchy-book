# See the pacman.conf(5) manpage for option and repository directives
# Chromebooks have an edge channel alone: their platform packages are published
# for edge only so far, and stable and rc templates come once a release
# supports them. Arch Linux ARM provides the aarch64 repositories used below.

[options]
Color
ILoveCandy
VerbosePkgLists
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm

# By default, pacman accepts packages signed by keys that its local keyring
# trusts (see pacman-key and its man page), as well as unsigned packages.
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# pacman searches repositories in the order defined here. The Chromebook
# repository comes first, so its builds (the kernels, the platform packages and
# the Omarchy runtime that registers this platform) win over the same names in
# Omarchy's repository and Arch Linux ARM. It is published as release assets of
# the repository that builds it (book/specs/0006-package-repository.md).
[omarchy-chromebook]
Server = https://github.com/Brunux/omarchy-book/releases/download/chromebook-edge-$arch

[omarchy]
Server = https://pkgs.omarchy.org/edge/$arch

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist
